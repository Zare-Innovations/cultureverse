# The shop at /shop is baked in at build time from the Squarespace store (lib/shop.ts), so a product
# or price change there only shows after a deploy. This pings Vercel's deploy hook every night so the
# shop never drifts more than a day. Create the hook in Vercel (Project > Settings > Git > Deploy
# Hooks, branch main) and store its URL as the VERCEL_DEPLOY_HOOK repository secret.
name: Rebuild the shop
on:
  schedule:
    - cron: '17 9 * * *' # 09:17 UTC, early morning in Atlanta
  workflow_dispatch:
jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a production deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK is not set"; exit 1; fi
          curl -fsS -X POST "$HOOK" >/dev/null && echo "deploy requested"
